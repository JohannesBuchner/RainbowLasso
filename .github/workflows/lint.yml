# This workflow checks the style of the Python scripts with flake8, pycodestyle and pydocstyle
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: lint

on:
  push:
    branches: [ main, 'feature-*' ]
  pull_request:
    branches: [ main ]

jobs:
  lint:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install lint tools
      run: python -m pip install flake8 pycodestyle pydocstyle
    - name: Lint with flake8, pycodestyle and pydocstyle
      run: make lint
