; flake8, pycodestyle and pydocstyle configuration for the pipeline scripts.
; The scripts keep their own style (tabs, tight commas, long stilts command
; lines); these ignores reflect that instead of reformatting.
[flake8]
max-line-length = 160
extend-ignore = W293,W291,E302,E225,E305,E261,W191,E101,E741,E402,E221,E401,E306,E303,E251,E117,E262,E203,E116,E114,E231,E265,E501,E128,E122

[pycodestyle]
count = false
ignore = W191,W291,W293,E225,E302,E265,E305,E261,E101,E741,E402,E221,E401,E306,E303,E251,E117,E262,E203,E116,E114,E226,E121,E231,E501,E128,E122,W503
max-line-length = 160
statistics = false

[pydocstyle]
add-ignore = D101,D102,D103,D202,D205,D210,D400,D401,D412,D200
